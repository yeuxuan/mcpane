name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand-scan:
    name: 静态守卫
    runs-on: ubuntu-latest
    # 每个 job 都设超时：GitHub 的默认值是 360 分钟，一次卡死的构建能把这 6 小时
    # 烧满——在按 2 倍计费的 Windows runner 上就是 720 折算分钟，小半个月配额。
    # 各值取「正常耗时的两三倍」。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 扫描品牌标识混用
        run: bash scripts/brand-scan.sh
      # 版本号漂移不影响编译和测试，只在真发布后才以「装完更新仍提示有更新」
      # 的形式暴露——必须在合入时就拦住
      - name: 校验版本号四处一致
        run: bash scripts/bump-version.sh
      - name: 拦截本地演练用的 updater 配置
        run: bash scripts/release-guard.sh
      # Windows 安装钩子唯一的编译时机是发版那次 tauri build，写错要到打包
      # 失败才暴露——同「校验版本号四处一致」，必须在合入时就拦住。
      - name: 校验 NSIS 安装钩子
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nsis
          bash scripts/check-nsis-hooks.sh

  # Windows 专属分支的 Rust 与前端在 platform-ci.yml（只在发版前 dispatch，
  # release-tag.sh 预检硬卡它绿）：Windows runner 按 2 倍计费，放在每次
  # push 里一年烧几万折算分钟。跨平台共享代码（占绝大多数）不该等到下次发版
  # 才校验编译——下面的 rust job 跑在 1 倍计费的 ubuntu 上，只覆盖不了 cfg(windows)
  # 与 cfg(target_os = "macos") 两支，其余的 clippy/test 覆盖率与 platform-ci
  # 一致；macOS 那支由开发机的日常构建天天覆盖，不另花 10 倍计费重跑一遍。
  rust:
    name: Rust (ubuntu)
    needs: brand-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --no-fail-fast

      # 只有 src-tauri 需要：它依赖 Tauri，glib-sys 的 build 脚本走 pkg-config
      # 找 GTK，runner 不自带就直接 build failed。根 workspace 的 crate 不碰
      # 这些，所以装在上面三步之后、src-tauri 三步之前。
      # 这里只装编译期依赖；打包才需要的 patchelf / xdg-utils 见 release.yml。
      - name: 安装 src-tauri 的系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev

      # src-tauri 自带 [workspace]，上面的 --workspace 覆盖不到它。
      - name: 准备 sidecar 占位
        working-directory: apps/desktop/src-tauri
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p binaries
          target="binaries/mcpane-hub-${triple}"
          [ -f "$target" ] || : > "$target"
      - name: src-tauri fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: src-tauri clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: src-tauri test
        working-directory: apps/desktop/src-tauri
        run: cargo test --all-features --no-fail-fast

  frontend:
    name: Frontend (ubuntu)
    needs: brand-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # 产物构建必须进 CI：typecheck/lint/test 都不跑 vite build，
      # 构建失败（如动态导入路径写错、分包配置炸裂）否则要拖到发版
      # tauri build 才暴露——那既不跑测试也不可逆。
      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    needs: brand-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 缓存 Playwright 浏览器
        id: playwright-cache
        uses: actions/cache@v4
        with:
          # @playwright/test 是 pin 死的，浏览器版本随它走，key 跟着 lockfile 即可。
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: 安装 Playwright 浏览器
        # webkit 不能省：Tauri 桌面端跑的是 WKWebView，视觉断言以 webkit 为准。
        # 缓存只覆盖浏览器二进制；apt 系统依赖装在缓存路径之外，每轮都得装，
        # 命中时用 install-deps 只补那部分（下载两套浏览器是本 job 最慢的一步）。
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm --filter @mcpane/desktop exec playwright install-deps chromium webkit
          else
            pnpm --filter @mcpane/desktop exec playwright install chromium webkit --with-deps
          fi
      # E2E 针对 vite dev（无 Tauri runtime，IPC 失败时的优雅降级本身是被测行为），
      # webServer 由 playwright.config.ts 自动拉起
      - run: pnpm --filter @mcpane/desktop e2e

  # GATE-E 要求「无高危依赖漏洞」，此前没有任何自动化在管这一条，只能靠人工想起来查。
  audit:
    name: 依赖漏洞扫描
    needs: brand-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # 预编译二进制，比 cargo install 快两个数量级。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # 只卡 vulnerability。unsound/yanked 警告不改退出码（cargo audit 的默认行为），
      # 这是有意的：本仓当前那 19 条警告全在传递依赖上，卡住它们只会逼人写白名单，
      # 白名单一开就再没人看了。
      - name: cargo audit（根 workspace）
        run: cargo audit
      - name: cargo audit（src-tauri workspace）
        # src-tauri 自带 [workspace]、也自带一份 Cargo.lock，根目录那次覆盖不到它
        working-directory: apps/desktop/src-tauri
        run: cargo audit
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --prod 是重点：当前 7 条告警全在 devDependencies（jsdom/vitest 的传递依赖
      # undici 等），它们只活在测试进程里、不进分发包。拿它们卡 CI 属于噪音，
      # 而进包的那部分必须干净——现在正是干净的，所以这道守卫从第一天起就是有效的。
      - run: pnpm audit --prod --audit-level high
