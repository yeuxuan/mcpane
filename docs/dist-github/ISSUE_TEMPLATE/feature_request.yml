name: 功能建议
description: 提出新功能或改进现有功能的建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述当前场景下的不便之处，而不只是期望的功能本身
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望 MCPane 如何支持这个场景
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充说明
      description: 目前如何绕过？是否考虑过其他做法？
